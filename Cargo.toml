[workspace]
resolver = "2"
members = ["apps/launcher", "crates/manifest", "crates/installer", "crates/build-manager", "crates/session", "crates/transport"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

